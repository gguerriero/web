<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McDonald's - Menú</title>
<style>
  :root{
    --yellow:#FFC72C;
    --red:#DA291C;
    --dark:#292929;
    --gray-bg:#F7F7F7;
    --gray-text:#6E6E6E;
    --card-shadow: 0 2px 10px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--dark);
    -webkit-tap-highlight-color: transparent;
  }
  .app{
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    background: #fff;
    display:flex;
    flex-direction:column;
  }

  header.topbar{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding: 20px 20px 16px; background:#fff; border-bottom: 1px solid #eee;
  }
  header.topbar .logo{ width:34px; height:34px; }
  header.topbar h1{ font-size:17px; margin:0; font-weight:800; }

  .intro{ padding: 18px 20px 4px; text-align:center; }
  .intro h2{ font-size:19px; font-weight:800; margin:0 0 4px; }
  .intro p{ font-size:13.5px; color:var(--gray-text); margin:0; }

  .options{ padding: 16px 20px 24px; display:flex; flex-direction:column; gap:16px; flex:1; }

  .option-card{
    display:block; text-decoration:none; color:inherit;
    background:#fff; border:1px solid #f0f0f0; border-radius:18px;
    box-shadow: var(--card-shadow); overflow:hidden; cursor:pointer;
  }
  .option-card:active{ transform: scale(0.98); }

  .option-hero{
    height: 168px; position:relative; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .hero-postres{ background: linear-gradient(160deg, #FFF3D0 0%, #FFE7A8 100%); }
  .hero-menu{ background: linear-gradient(160deg, #FFE1DC 0%, #FFC2B8 100%); }

  /* collage de postres */
  .postres-collage{ position:relative; width:220px; height:130px; }
  .postres-collage img{
    position:absolute; border-radius:50%; border:4px solid #fff;
    box-shadow:0 4px 14px rgba(0,0,0,0.15); object-fit:cover; background:#fff;
  }
  .postres-collage .p1{ width:96px; height:96px; left:0; top:12px; z-index:1; }
  .postres-collage .p2{ width:112px; height:112px; left:62px; top:0; z-index:2; }
  .postres-collage .p3{ width:96px; height:96px; left:124px; top:16px; z-index:1; }

  .menu-collage{ position:relative; width:230px; height:130px; }
  .menu-collage img{
    position:absolute; border-radius:14px; border:4px solid #fff;
    box-shadow:0 4px 14px rgba(0,0,0,0.18); object-fit:cover; background:#fff;
  }
  .menu-collage .m1{ width:118px; height:88px; left:0; top:20px; z-index:1; transform: rotate(-4deg); }
  .menu-collage .m2{ width:130px; height:98px; left:78px; top:2px; z-index:2; }
  .menu-collage .m3{ width:110px; height:84px; left:112px; top:38px; z-index:1; transform: rotate(5deg); }

  .option-badge{
    position:absolute; top:12px; left:14px; background:rgba(255,255,255,0.85);
    border-radius:20px; padding:5px 12px; font-size:11px; font-weight:800; color:var(--dark);
  }

  .option-body{
    padding: 14px 18px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .option-body .title{ font-size:18px; font-weight:800; margin:0 0 3px; }
  .option-body .subtitle{ font-size:12.5px; color:var(--gray-text); margin:0; }
  .option-body .chevron{ font-size:22px; color:#ccc; flex:0 0 auto; }

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:30px; transform: translateX(-50%) translateY(20px);
    background:#fff; border-radius:14px; box-shadow:0 4px 20px rgba(0,0,0,0.18);
    padding:14px 22px; text-align:center; z-index:60; opacity:0; pointer-events:none;
    transition: opacity .25s ease, transform .25s ease; max-width:280px;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
  .toast p{ margin:0; font-size:13px; font-weight:700; color:var(--dark); }
</style>
</head>
